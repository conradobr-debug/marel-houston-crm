<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Marel CRM Repository Contract Validation</title>
  <style>
    body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 20px;color:#244047}
    label{display:block;margin:12px 0 4px}input,button{font:inherit;padding:9px 11px}input{width:100%;box-sizing:border-box}button{margin-top:16px;cursor:pointer}
    pre{white-space:pre-wrap;background:#f1f8f9;border:1px solid #d9e7ea;border-radius:10px;padding:16px;min-height:120px}
  </style>
</head>
<body>
  <h1>Repository contract validation</h1>
  <p>Runs synthetic CRUD checks against the mock repository and, when configured, local Supabase. Created records are deleted at the end.</p>
  <label for="email">Synthetic local email</label>
  <input id="email" type="email" value="admin@marel-houston.local" />
  <label for="password">Synthetic local password</label>
  <input id="password" type="password" autocomplete="off" />
  <button id="run" type="button">Run validation</button>
  <pre id="output" role="status">Ready.</pre>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/runtime-config.js" onerror="window.MAREL_RUNTIME={supabaseUrl:'',supabasePublishableKey:'',workspaceId:''}"></script>
  <script src="../js/data/crm-mappers.js"></script>
  <script src="../js/data/mock-crm-repository.js"></script>
  <script src="../js/data/supabase-crm-repository.js"></script>
  <script src="../js/data/crm-repository-contract.js"></script>
  <script src="repository-contract-validation.js"></script>
</body>
</html>
